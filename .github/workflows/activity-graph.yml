name: Update GitHub Activity Graph

on:
  schedule:
    - cron: "0 */12 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Generate activity graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: EnriqueForte

          options: >
            bg_color=0d1117&
            color=58a6ff&
            line=58a6ff&
            point=ffffff&
            area=true&
            hide_border=true&
            height=300&
            days=31

          output_path: dist/activity-graph.svg

          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish activity graph
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
